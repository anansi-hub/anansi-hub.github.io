<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Reset password</title>
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <main class="center">
      <section class="card">
        <header class="stack center-text">
          <h1 class="title">Reset password</h1>
          <p class="subtitle">Enter your email and we’ll send a reset link.</p>
        </header>

        <form class="stack form" action="./login.html" method="post" novalidate>
          <div class="field">
            <label for="reset-email">Email</label>
            <input
              id="reset-email"
              name="email"
              type="email"
              inputmode="email"
              autocomplete="username"
              placeholder="you@example.com"
              required
            />
          </div>

          <button class="btn" type="submit">Send reset link</button>

          <p class="subtitle" style="margin:8px 0 0; text-align:center;">
            <a href="./login.html">Back to sign in</a>
          </p>
        </form>
      </section>
    </main>
  </body>
</html>
